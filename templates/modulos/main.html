<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VisualCam AR - Realidad Aumentada con Oclusión</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e17;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        #ar-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #000;
        }

        #cameraBgImage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            display: none;
            background: #000;
        }

        #cameraBgImage.active { display: block; }

        /* Canvas de oclusión (máscara) - se superpone sobre la cámara */
        #occlusionCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: none;
        }

        #occlusionCanvas.active {
            display: block;
        }

        #ar-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 3;
            pointer-events: auto !important;
            display: block;
            touch-action: none;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 10;
        }

        .header-ar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1.5rem;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
            pointer-events: auto;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .header-ar .logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
            color: white;
        }

        .header-ar .logo i { font-size: 1.5rem; color: #4a7cf7; }
        .header-ar .logo h1 { font-size: 1.2rem; font-weight: 600; color: white; }
        .header-ar .logo span { font-size: 0.65rem; color: rgba(255,255,255,0.4); display: block; }

        .nav-modules {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            pointer-events: auto;
            flex-wrap: wrap;
        }

        .nav-modules a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-size: 0.75rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }

        .nav-modules a:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .nav-modules a.active {
            background: rgba(74, 124, 247, 0.2);
            color: #4a7cf7;
            border-color: rgba(74, 124, 247, 0.3);
            box-shadow: 0 0 20px rgba(74, 124, 247, 0.1);
        }

        .nav-modules a i { font-size: 0.8rem; }
        .nav-modules a .badge {
            background: rgba(76, 217, 100, 0.2);
            color: #4cd964;
            font-size: 0.55rem;
            padding: 0.05rem 0.4rem;
            border-radius: 10px;
            font-weight: 600;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.3rem 1rem;
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.05);
            pointer-events: auto;
        }

        .status-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4cd964;
            animation: pulse 2s infinite;
        }

        .status-badge .dot.inactive { background: #ff6b6b; animation: none; }
        .status-badge .dot.occlusion { background: #ffc107; animation: pulse 1s infinite; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .control-panel {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 14, 23, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 1.5rem;
            padding: 0.8rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            pointer-events: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            flex-wrap: wrap;
            justify-content: center;
            z-index: 30;
            min-width: 280px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .control-group .label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255,255,255,0.3);
            font-weight: 600;
            min-width: 10px;
        }

        .control-group input[type="range"] {
            width: 60px;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            outline: none;
            transition: all 0.2s ease;
        }

        .control-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4a7cf7;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.1);
            transition: all 0.2s ease;
        }

        .control-group input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: #6c5ce7;
        }

        .control-group .value {
            font-size: 0.65rem;
            font-family: monospace;
            color: rgba(255,255,255,0.5);
            min-width: 32px;
            text-align: center;
        }

        .control-divider {
            width: 1px;
            height: 24px;
            background: rgba(255,255,255,0.06);
        }

        .btn-control {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.35rem 0.8rem;
            border: none;
            border-radius: 50px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.65rem;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.05);
            white-space: nowrap;
        }

        .btn-control:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,0.08);
            color: white;
        }

        .btn-control.primary {
            background: linear-gradient(135deg, #4a7cf7, #6c5ce7);
            color: white;
            border: none;
            box-shadow: 0 4px 16px rgba(74, 124, 247, 0.25);
        }

        .btn-control.primary:hover {
            box-shadow: 0 8px 24px rgba(74, 124, 247, 0.35);
            transform: translateY(-2px);
            color: white;
        }

        .btn-control.danger {
            background: rgba(255, 107, 107, 0.12);
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.15);
        }

        .btn-control.danger:hover {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .btn-control.success {
            background: rgba(76, 217, 100, 0.12);
            color: #4cd964;
            border-color: rgba(76, 217, 100, 0.15);
        }

        .btn-control.success:hover {
            background: rgba(76, 217, 100, 0.2);
            color: #4cd964;
        }

        .btn-control i { font-size: 0.75rem; }

        .objects-panel {
            position: absolute;
            top: 5rem;
            right: 1.5rem;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 1.5rem;
            padding: 1rem;
            min-width: 180px;
            max-height: 50vh;
            overflow-y: auto;
            pointer-events: auto;
            display: none;
            z-index: 20;
        }

        .objects-panel.active { display: block; }
        .objects-panel::-webkit-scrollbar { width: 4px; }
        .objects-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .objects-panel h3 {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.25);
            margin-bottom: 0.6rem;
        }

        .object-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.35rem 0.6rem;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
            margin-bottom: 0.2rem;
            border: 1px solid rgba(255,255,255,0.02);
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .object-item:hover { background: rgba(255,255,255,0.06); }
        .object-item.selected { 
            background: rgba(74, 124, 247, 0.12); 
            border-color: rgba(74, 124, 247, 0.2);
        }
        .object-item.occluded { opacity: 0.3; }

        .object-item .name { color: rgba(255,255,255,0.7); }
        .object-item .delete-btn {
            background: none;
            border: none;
            color: rgba(255,107,107,0.3);
            cursor: pointer;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            transition: all 0.3s ease;
            font-size: 0.65rem;
        }

        .object-item .delete-btn:hover {
            color: #ff6b6b;
            background: rgba(255,107,107,0.1);
        }

        .toast {
            position: fixed;
            bottom: 6rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 14, 23, 0.95);
            backdrop-filter: blur(20px);
            padding: 0.4rem 1rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 0.7rem;
            z-index: 1000;
            display: none;
            animation: slideUp 0.3s ease-out;
            font-family: 'Inter', sans-serif;
            pointer-events: none;
        }

        .toast.show { display: flex; align-items: center; gap: 0.5rem; }
        .toast.success { border-color: rgba(76, 217, 100, 0.2); }
        .toast.error { border-color: rgba(255, 107, 107, 0.2); }
        .toast.info { border-color: rgba(74, 124, 247, 0.2); }
        .toast i { font-size: 0.7rem; }
        .toast.success i { color: #4cd964; }
        .toast.error i { color: #ff6b6b; }
        .toast.info i { color: #4a7cf7; }

        @keyframes slideUp {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            100% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .gps-status {
            position: absolute;
            top: 5rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 0.2rem 1rem;
            border-radius: 20px;
            font-size: 0.55rem;
            color: rgba(255,255,255,0.3);
            pointer-events: none;
            z-index: 5;
            display: none;
            border: 1px solid rgba(74,124,247,0.05);
        }

        .gps-status.active { display: block; }
        .gps-status .gps-coords { color: #4a7cf7; font-family: monospace; }

        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            pointer-events: none;
            opacity: 0.15;
        }

        .crosshair .horizontal {
            width: 25px;
            height: 1px;
            background: rgba(255,255,255,0.4);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .crosshair .vertical {
            width: 1px;
            height: 25px;
            background: rgba(255,255,255,0.4);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .crosshair .center-dot {
            width: 2px;
            height: 2px;
            background: rgba(74, 124, 247, 0.4);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .object-highlight {
            position: absolute;
            z-index: 4;
            pointer-events: none;
            border: 1.5px solid rgba(74, 124, 247, 0.25);
            border-radius: 50%;
            display: none;
        }

        .object-highlight.active { display: block; }

        .occlusion-indicator {
            position: absolute;
            bottom: 6.5rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 193, 7, 0.15);
            backdrop-filter: blur(10px);
            padding: 0.3rem 1rem;
            border-radius: 20px;
            font-size: 0.6rem;
            color: rgba(255, 193, 7, 0.5);
            pointer-events: none;
            z-index: 5;
            display: none;
            border: 1px solid rgba(255, 193, 7, 0.1);
        }

        .occlusion-indicator.active { display: block; }
        .occlusion-indicator .highlight { color: #ffc107; }

        @media (max-width: 1024px) {
            .nav-modules a span { display: none; }
            .nav-modules a { padding: 0.3rem 0.6rem; }
            .header-ar { padding: 0.6rem 1rem; }
            .control-panel { padding: 0.6rem 1rem; gap: 0.8rem; }
            .control-group input[type="range"] { width: 45px; }
        }

        @media (max-width: 768px) {
            .control-panel {
                bottom: 0.8rem;
                padding: 0.5rem 0.8rem;
                gap: 0.5rem;
                border-radius: 1rem;
                width: 96%;
                min-width: unset;
            }
            .control-group .label { font-size: 0.45rem; min-width: 8px; }
            .control-group input[type="range"] { width: 35px; }
            .control-group .value { font-size: 0.5rem; min-width: 24px; }
            .btn-control { padding: 0.25rem 0.5rem; font-size: 0.55rem; }
            .btn-control i { font-size: 0.6rem; }
            .nav-modules a i { font-size: 0.85rem; }
            .header-ar .logo h1 { font-size: 0.9rem; }
            .header-ar .logo span { display: none; }
            .status-badge { font-size: 0.5rem; padding: 0.15rem 0.5rem; }
            .objects-panel { right: 0.5rem; top: 4.5rem; min-width: 130px; padding: 0.6rem; }
            .control-divider { height: 16px; }
            .occlusion-indicator { font-size: 0.5rem; padding: 0.2rem 0.6rem; bottom: 6rem; }
        }

        @media (max-width: 480px) {
            .control-panel { padding: 0.4rem 0.4rem; gap: 0.3rem; border-radius: 0.8rem; }
            .control-group input[type="range"] { width: 25px; }
            .control-group .value { font-size: 0.45rem; min-width: 18px; }
            .btn-control { padding: 0.2rem 0.35rem; font-size: 0.45rem; }
            .btn-control i { font-size: 0.5rem; }
            .control-divider { height: 12px; }
            .header-ar .logo i { font-size: 1rem; }
            .header-ar .logo h1 { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <div id="ar-container">
        <img id="cameraBgImage" alt="Stream de cámara" />
        
        <!-- Canvas para la máscara de oclusión -->
        <canvas id="occlusionCanvas"></canvas>
        
        <div class="crosshair" id="crosshair">
            <div class="horizontal"></div>
            <div class="vertical"></div>
            <div class="center-dot"></div>
        </div>

        <div class="object-highlight" id="objectHighlight"></div>
    </div>

    <div class="gps-status" id="gpsStatus">
        <span class="gps-coords" id="gpsCoordsDisplay">--</span>
    </div>

    <div class="occlusion-indicator" id="occlusionIndicator">
        <i class="fas fa-hand"></i> Oclusión activa: <span class="highlight" id="occlusionStatus">Mano detectada</span>
    </div>

    <div class="ui-overlay">
        <div class="header-ar">
            <a href="/" class="logo">
                <i class="fas fa-cube"></i>
                <div>
                    <h1>VisualCam AR</h1>
                    <span>Realidad Aumentada</span>
                </div>
            </a>
            
            <div class="nav-modules">
                <a href="/modulos/main" class="active"><i class="fas fa-cube"></i><span>AR</span></a>
                <a href="/modulos/modulos/camara.html"><i class="fas fa-camera"></i><span>Cámara</span></a>
                <a href="/modulos/modulos/insertar_objeto.html"><i class="fas fa-cube"></i><span>Objetos 3D</span><span class="badge">Nuevo</span></a>
                <a href="/modulos/modulos/ubicacion.html"><i class="fas fa-location-dot"></i><span>Ubicación</span><span class="badge">Nuevo</span></a>
                <a href="/modulos/efectos"><i class="fas fa-magic"></i><span>Efectos</span></a>
                <a href="/modulos/historial"><i class="fas fa-clock-rotate-left"></i><span>Historial</span></a>
            </div>

            <div class="status-badge">
                <span class="dot" id="arStatusDot"></span>
                <span id="arStatusText">AR Activo</span>
            </div>
        </div>

        <div class="objects-panel" id="objectsPanel">
            <h3><i class="fas fa-cubes"></i> Objetos</h3>
            <div id="objectsList"></div>
        </div>

        <div class="control-panel" id="controlPanel">
            <div class="control-group">
                <span class="label">X</span>
                <input type="range" id="posX" min="-5" max="5" step="0.01" value="0" />
                <span class="value" id="posXVal">0.00</span>
            </div>

            <div class="control-group">
                <span class="label">Y</span>
                <input type="range" id="posY" min="-3" max="3" step="0.01" value="0" />
                <span class="value" id="posYVal">0.00</span>
            </div>

            <div class="control-group">
                <span class="label">Z</span>
                <input type="range" id="posZ" min="-8" max="-0.5" step="0.01" value="-2.5" />
                <span class="value" id="posZVal">-2.50</span>
            </div>

            <div class="control-divider"></div>

            <div class="control-group">
                <span class="label">RX</span>
                <input type="range" id="rotX" min="-180" max="180" step="1" value="0" />
                <span class="value" id="rotXVal">0°</span>
            </div>

            <div class="control-group">
                <span class="label">RY</span>
                <input type="range" id="rotY" min="-180" max="180" step="1" value="0" />
                <span class="value" id="rotYVal">0°</span>
            </div>

            <div class="control-group">
                <span class="label">RZ</span>
                <input type="range" id="rotZ" min="-180" max="180" step="1" value="0" />
                <span class="value" id="rotZVal">0°</span>
            </div>

            <div class="control-divider"></div>

            <div class="control-group">
                <span class="label">S</span>
                <input type="range" id="scaleCtrl" min="0.1" max="3" step="0.05" value="1" />
                <span class="value" id="scaleVal">1.00</span>
            </div>

            <div class="control-divider"></div>

            <button class="btn-control primary" id="btnFixObject" title="Fijar objeto">
                <i class="fas fa-thumbtack"></i>
            </button>
            <button class="btn-control" id="btnTogglePanel" title="Lista de objetos">
                <i class="fas fa-list"></i>
            </button>
            <button class="btn-control success" id="btnToggleOcclusion" title="Activar/Desactivar oclusión">
                <i class="fas fa-hand"></i>
            </button>
            <button class="btn-control danger" id="btnClearAll" title="Limpiar todo">
                <i class="fas fa-trash"></i>
            </button>
        </div>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Mensaje</span>
    </div>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

    <script>
        (function() {
            'use strict';

            const CONFIG = {
                objectDistance: 2.5,
                maxObjects: 30,
                defaultColor: 0x4a7cf7,
                defaultScale: 0.8,
                gpsScale: 30.0,
                paralajeFactor: 1.0,
            };

            const state = {
                fixedObjects: [],
                cameraReady: false,
                isARInitialized: false,
                objectCounter: 0,
                camaraActiva: false,
                importedObjects: [],
                importedLocations: [],
                streamInterval: null,
                gpsReference: null,
                gpsReferencePosition: new THREE.Vector3(0, 0, 0),
                deviceOrientation: { alpha: 0, beta: 0, gamma: 0 },
                isTrackingOrientation: false,
                gpsReferenceSet: false,
                gpsWatchId: null,
                currentLat: null,
                currentLng: null,
                pendingObjectsProcessed: false,
                fixedPositions: new Map(),
                selectedObject: null,
                isDragging: false,
                isRotating: false,
                dragStartMouse: new THREE.Vector2(),
                dragStartPos: new THREE.Vector3(),
                dragStartRot: new THREE.Euler(),
                raycaster: new THREE.Raycaster(),
                mouse: new THREE.Vector2(),
                intersectableObjects: [],
                isPointerDown: false,
                isUpdatingControls: false,
                dragStartWorld: new THREE.Vector3(),
                occlusionEnabled: true,
                handLandmarks: null,
                isHandDetected: false,
                occlusionCanvas: null,
                occlusionCtx: null,
                occludedObjects: new Set(),
                mediaPipeReady: false,
            };

            // DOM
            const container = document.getElementById('ar-container');
            const cameraBg = document.getElementById('cameraBgImage');
